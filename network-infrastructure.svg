<g transform="translate(850 525)"><rect width="245" height="94" rx="15" fill="#f5fbff" opacity=".95"/><circle cx="39" cy="47" r="20" fill="#d9efff"/><path d="M29 47h20M39 37v20" stroke="#1678b8" stroke-width="4" stroke-linecap="round"/><text x="73" y="42" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#163c5c">Connected business</text><text x="73" y="65" font-family="Arial,sans-serif" font-size="13" fill="#63809a">Network • Wi-Fi • Security</text></g>
</svg>
